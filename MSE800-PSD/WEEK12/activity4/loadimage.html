<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Load Image with Flask</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f5f1e8;
			--panel: #fffaf1;
			--text: #1f2937;
			--muted: #6b7280;
			--accent: #0f766e;
			--accent-hover: #115e59;
			--border: #e5dcc8;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: Arial, Helvetica, sans-serif;
			background: linear-gradient(135deg, #f7f0e1 0%, #efe7d1 45%, #e8f2ef 100%);
			color: var(--text);
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.card {
			width: min(920px, 100%);
			background: rgba(255, 250, 241, 0.94);
			border: 1px solid var(--border);
			border-radius: 24px;
			box-shadow: 0 20px 60px rgba(31, 41, 55, 0.12);
			overflow: hidden;
		}

		.hero {
			padding: 32px 32px 16px;
		}

		h1 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 4vw, 3.25rem);
			letter-spacing: -0.04em;
		}

		p {
			margin: 0;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: flex;
			gap: 12px;
			align-items: center;
			flex-wrap: wrap;
			padding: 0 32px 24px;
		}

		input[type="file"] {
			flex: 1 1 280px;
			padding: 12px;
			border: 1px dashed var(--border);
			border-radius: 14px;
			background: #fff;
		}

		button {
			border: 0;
			border-radius: 999px;
			background: var(--accent);
			color: #fff;
			padding: 12px 20px;
			font-weight: 700;
			cursor: pointer;
		}

		button:hover {
			background: var(--accent-hover);
		}

		.status {
			padding: 0 32px 24px;
			color: var(--accent-hover);
			font-weight: 600;
		}

		.image-wrap {
			padding: 0 32px 32px;
		}

		.image-frame {
			background: #ffffff;
			border: 1px solid var(--border);
			border-radius: 20px;
			padding: 18px;
		}

		img {
			width: 100%;
			height: auto;
			max-height: 620px;
			object-fit: contain;
			display: block;
			border-radius: 14px;
		}

		@media (max-width: 640px) {
			.hero, form, .status, .image-wrap {
				padding-left: 18px;
				padding-right: 18px;
			}
		}
	</style>
</head>
<body>
	<main class="card">
		<section class="hero">
			<h1>Load and Show an Image</h1>
			<p>Choose an image file and Flask will upload it, then display it below.</p>
		</section>

		<form method="post" enctype="multipart/form-data">
			<input type="file" name="image" accept="image/*" required>
			<button type="submit">Upload Image</button>
		</form>

		<div class="status">{{ message }}</div>

		<section class="image-wrap">
			<div class="image-frame">
				<img src="{{ image_url }}" alt="Uploaded image preview">
			</div>
		</section>
	</main>
</body>
</html>
